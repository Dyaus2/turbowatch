name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest==9.2.0 ruff==0.16.9 httpx==0.28.1
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
