name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest==9.2.0 ruff==0.16.9 httpx==0.28.1
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Static API parity vs recorded FastAPI responses
        run: npm run test:parity
      - name: Build (server mode and static mode)
        run: npm run build && npm run build:static

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t turbowatch .
      - name: Smoke-test the running container
        run: |
          docker run -d -p 7860:7860 --name tw turbowatch
          for i in $(seq 1 100); do curl -fs localhost:7860/api/health && break; sleep 3; done
          curl -fs "localhost:7860/api/fleet?cycle=100" | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['engines'])==100; print(d['counts'])"
          curl -fs -X POST localhost:7860/api/copilot/ask -H 'Content-Type: application/json' -d '{"question":"What can cause a compressor stall?"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['mode']=='template' and d['citations']; print('copilot ok')"
          curl -fs localhost:7860/ | grep -q 'id="root"'
      - name: Container logs
        if: always()
        run: docker logs tw 2>&1 | tail -50 || true
